<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>沒有權限 · 발음·동사 연습장</title>
<style>
:root{--bg:#f6f1e7;--surface:#fdfcf8;--ink:#26241f;--muted:#6a645a;--line:#e6dfd2;--accent:#a8402c;--accent-line:#a8402c;--accent-ink:#ffffff}
@media (prefers-color-scheme:dark){:root{--bg:#1b1a17;--surface:#23211d;--ink:#ede7dc;--muted:#aca597;--line:#38352e;--accent:#b04a35;--accent-line:#b04a35;--accent-ink:#ffffff;color-scheme:dark}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,"Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif;line-height:1.7;padding:24px}
.card{max-width:440px;background:var(--surface);border:1px solid var(--line);border-top:4px solid #1f514e;border-radius:16px;padding:28px 24px;display:flex;flex-direction:column;gap:12px}
h1{font-size:22px;margin:0}
p{margin:0;color:var(--muted)}
a.btn{align-self:flex-start;background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent-line);text-decoration:none;border-radius:12px;padding:8px 16px;font-weight:600}
</style>
</head>
<body>
<main class="card">
  <img src="/img/illust/hanok.svg" alt="" width="240" height="124" style="align-self:center;max-width:100%;height:auto">
  <h1>沒有權限</h1>
  <p>這個頁面只有網站管理者可以使用。</p>
  <p>如果你是管理者，請確認 Azure 的「角色管理」已經把你的帳號設為 <code>admin</code>，然後登出再登入一次。</p>
  <a class="btn" href="/">回首頁</a>
  <a class="btn" href="/.auth/logout?post_logout_redirect_uri=/">登出，換一個帳號</a>
</main>
</body>
</html>
