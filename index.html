<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#173f35">
<title>발음·동사 연습장</title>
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <aside class="side" id="side" aria-label="選單">
    <div class="brand">
      <span class="brand-tile" lang="ko" aria-hidden="true">가</span>
      <div><h1 lang="ko">발음·동사 연습장</h1><p class="sub">韓文學習帳　世宗韓國語</p></div>
    </div>
    <nav class="mnav" id="mods" aria-label="單元"></nav>
    <div class="side-tools">
      <div class="tools">
        <div class="seg" role="group" aria-label="朗讀速度">
          <button type="button" id="rate-n" aria-pressed="true">正常語速</button>
          <button type="button" id="rate-s" aria-pressed="false">慢速</button>
        </div>
        <span class="vs" id="voice">檢查語音中…</span>
      </div>
      <span class="sync" id="sync" aria-live="polite"></span>
      <span class="acct" id="acct" hidden></span>
    </div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <div class="main-col">
    <header class="topbar">
      <button type="button" class="round-btn" id="tb-back" aria-label="回首頁" hidden><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14.5 5.5-6.5 6.5 6.5 6.5"/></svg></button>
      <span class="tb-title" id="tb-title"></span>
      <button type="button" class="round-btn" id="menu-btn" aria-label="開啟選單" aria-controls="side" aria-expanded="false"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    </header>
    <main class="content">
      <div class="content-inner">
        <div class="page-head" id="page-head">
          <section class="mhero" id="mhero"></section>
          <div class="subtabs" id="pages" role="tablist" aria-label="頁面"></div>
        </div>
        <div id="view"></div>
        <noscript><p>這個網站需要開啟 JavaScript 才能使用。</p></noscript>
      </div>
    </main>
  </div>

  <nav class="tabbar-b" id="tabbar" aria-label="主要功能">
    <button type="button" data-tab="home"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 10.5 12 4l8.5 6.5"/><path d="M5.5 9v10.5h13V9"/><path d="M10 19.5v-5h4v5"/></svg><span>首頁</span></button>
    <button type="button" data-tab="units" aria-controls="side" aria-expanded="false"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg><span>單元</span></button>
    <button type="button" data-tab="daily"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4.5" y="3.5" width="15" height="17" rx="2"/><path d="m8 9 1.5 1.5L12.5 7.5"/><path d="M14.5 9.5H16"/><path d="m8 15 1.5 1.5 3-3"/><path d="M14.5 15.5H16"/></svg><span>今日測驗</span></button>
    <button type="button" data-tab="records"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 19.5h15"/><rect x="6" y="11" width="3" height="6" rx="1"/><rect x="10.5" y="6.5" width="3" height="10.5" rx="1"/><rect x="15" y="9" width="3" height="8" rx="1"/></svg><span>紀錄</span></button>
  </nav>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
