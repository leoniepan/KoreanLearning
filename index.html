<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d6b58">
<title>발음·동사 연습장</title>
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <aside class="side" id="side" aria-label="選單">
    <div class="brand">
      <h1>발음 <span>·</span> 동사<br>연습장</h1>
      <p class="sub">韓文學習帳　世宗韓國語 1A～1B</p>
    </div>
    <nav class="mnav" id="mods" aria-label="單元"></nav>
    <div class="side-tools">
      <div class="tools">
        <div class="seg" role="group" aria-label="朗讀速度">
          <button type="button" id="rate-n" aria-pressed="true">正常語速</button>
          <button type="button" id="rate-s" aria-pressed="false">慢速</button>
        </div>
        <span class="vs" id="voice">檢查語音中…</span>
      </div>
      <span class="sync" id="sync" aria-live="polite"></span>
      <span class="acct" id="acct" hidden></span>
    </div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <div class="main-col">
    <header class="topbar">
      <button type="button" class="menu-btn" id="menu-btn" aria-label="開啟選單" aria-controls="side" aria-expanded="false"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5.5h14M3 10h14M3 14.5h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg></button>
      <span class="tb-title" id="tb-title"></span>
    </header>
    <main class="content">
      <div class="content-inner">
        <div class="page-head">
          <h2 id="page-title"></h2>
          <div class="subtabs" id="pages" role="tablist" aria-label="頁面"></div>
        </div>
        <div id="view"></div>
        <noscript><p>這個網站需要開啟 JavaScript 才能使用。</p></noscript>
      </div>
    </main>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
